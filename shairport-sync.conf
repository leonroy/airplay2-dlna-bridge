// AirPlay 2 receiver, audio to a pipe consumed by the bridge container
general =
{
	name = "AirPlay 2 Bridge";
	output_backend = "pipe";
	// volume is forwarded to the WiiM hardware (UPnP RenderingControl) by the
	// bridge, so don't also attenuate the PCM
	ignore_volume_control = "yes";
	// output ahead of the AirPlay clock to offset the WiiM's own HTTP buffering
	// (disabled: rolled back together with FLUSH_RESYNC after seek stalls)
	// audio_backend_latency_offset_in_seconds = -1.5;
};

pipe =
{
	name = "/shared/audio";
	// shairport-sync 5.x defaults to 48000/S32_LE for AirPlay 2 sessions;
	// the bridge expects 44100/S16_LE, so pin the output format
	output_rate = 44100;
	output_format = "S16_LE";
	output_channels = 2;
};

metadata =
{
	enabled = "yes";
	include_cover_art = "yes";
	pipe_name = "/shared/metadata";
};

sessioncontrol =
{
	session_timeout = 60;
};

// log sync/underrun statistics so timing problems are visible
diagnostics =
{
	log_verbosity = 1;
	statistics = "yes";
};
