# AirPlay → UPnP/DLNA renderer bridge
# iPhone -(AirPlay)-> shairport-sync -PCM-> bridge (FLAC over HTTP) -> renderer
#
# Set HOST_IP and RENDERER_IP in .env before starting (see .env.example).

services:
  # AirPlay receiver (nqptp is bundled inside this image)
  shairport-sync:
    image: ghcr.io/leonroy/shairport-sync:latest
    network_mode: host
    restart: unless-stopped
    depends_on:
      - bridge
    environment:
      - AIRPLAY_VERSION=${AIRPLAY_VERSION:-2}
      - AIRPLAY_NAME=${AIRPLAY_NAME:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$AIRPLAY_VERSION" in
          1) service_type=classic ;;
          2) service_type=airplay2 ;;
          *) echo "Invalid AIRPLAY_VERSION: set AIRPLAY_VERSION to 1 or 2 in .env." >&2; exit 1 ;;
        esac
        exec ./run.sh "--service-type=$$service_type" -a "$${AIRPLAY_NAME:-AirPlay $$AIRPLAY_VERSION Bridge}"
    volumes:
      - ./shairport-sync.conf:/etc/shairport-sync.conf:ro
      - shared:/shared

  bridge:
    image: ghcr.io/leonroy/airplay2-dlna-bridge:${BRIDGE_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${STREAM_PORT:-8000}:8000"
    environment:
      # LAN address of the UPnP/DLNA renderer (auto play/stop/volume; empty = disabled)
      - RENDERER_IP=${RENDERER_IP:-}
      # stream URL given to the renderer: must be reachable from it on the LAN
      - STREAM_URL=http://${HOST_IP:?set HOST_IP in .env}:${STREAM_PORT:-8000}/stream.flac
      # phone full volume maps to this renderer hardware volume (protect ears/speakers)
      - MAX_VOLUME=${MAX_VOLUME:-100}
      # Bound admitted HTTP handlers and FLAC processes, preserving reconnect overlap.
      - HTTP_MAX_CONNECTIONS=${HTTP_MAX_CONNECTIONS:-16}
      - FLAC_MAX_ENCODERS=${FLAC_MAX_ENCODERS:-4}
      - HTTP_HEADER_TIMEOUT=${HTTP_HEADER_TIMEOUT:-5}
      - HTTP_HEADER_DEADLINE=${HTTP_HEADER_DEADLINE:-10}
      # push track title/artist/album/artwork to the renderer's display on track change
      # (the player restarts the stream on each push: ~2-4s gap per track; 0 = off)
      - DIDL_PUSH=${DIDL_PUSH:-1}
    volumes:
      - shared:/shared

volumes:
  shared:
