name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check title against release policy
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY'
          import os, tomllib
          from semantic_release.commit_parser.conventional import ConventionalCommitParser, ConventionalCommitParserOptions
          from semantic_release.enums import LevelBump
          with open('pyproject.toml', 'rb') as f:
              options = tomllib.load(f)['tool']['semantic_release']['commit_parser_options']
          result = ConventionalCommitParser(ConventionalCommitParserOptions(**options)).parse_message(os.environ['PR_TITLE'])
          if result is None or result.bump == LevelBump.NO_RELEASE:
              raise SystemExit('Use a Conventional Commit title, e.g. fix: restore artwork or feat: add configuration')
          PY
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  browser:
    name: Live log browser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-browser.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_log_browser.py -q
  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: python3 .github/scripts/publish.py --check-local
      - name: Validate production and development Compose files
        env:
          HOST_IP: 192.0.2.10
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
          STREAM_PORT=8001 docker compose -p airplay1-dlna-bridge -f docker-compose.yml -f docker-compose.airplay1.yml config --quiet
