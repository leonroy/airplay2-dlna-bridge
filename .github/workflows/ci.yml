name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check title against release policy
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY'
          import os, tomllib
          from semantic_release.commit_parser.conventional import ConventionalCommitParser, ConventionalCommitParserOptions
          from semantic_release.enums import LevelBump
          with open('pyproject.toml', 'rb') as f:
              options = tomllib.load(f)['tool']['semantic_release']['commit_parser_options']
          result = ConventionalCommitParser(ConventionalCommitParserOptions(**options)).parse_message(os.environ['PR_TITLE'])
          if result is None or result.bump == LevelBump.NO_RELEASE:
              raise SystemExit('Use a Conventional Commit title, e.g. fix: restore artwork or feat: add configuration')
          PY
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build --tag bridge-ci bridge
      - run: docker run bridge-ci python3 -c "import runpy; runpy.run_path('/app/server.py', run_name='smoke_test')"
